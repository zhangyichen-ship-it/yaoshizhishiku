name: CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  DEPLOY_PATH: /www/wwwroot/yaoshizhishiku

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: backend/Dockerfile
            cache_scope: backend
          - name: frontend
            context: ./frontend
            file: frontend/Dockerfile
            cache_scope: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=min,scope=${{ matrix.cache_scope }}

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ secrets.HOSTIP != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTIP }}
          username: ${{ secrets.HOSTNAME }}
          key: ${{ secrets.SIYAO }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: mkdir -p /www/wwwroot/yaoshizhishiku

      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTIP }}
          username: ${{ secrets.HOSTNAME }}
          key: ${{ secrets.SIYAO }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.yml,.env.example"
          target: /www/wwwroot/yaoshizhishiku
          overwrite: true

      - name: Pull images and start stack
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.HOSTIP }}
          username: ${{ secrets.HOSTNAME }}
          key: ${{ secrets.SIYAO }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USERNAME,GITHUB_REPOSITORY,GITHUB_SHA,GITHUB_REF_TYPE,GITHUB_REF_NAME
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            DEPLOY_PATH=/www/wwwroot/yaoshizhishiku
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              cp .env.example .env
              echo "已生成 $DEPLOY_PATH/.env（来自模板）。请尽快改成生产密码，不要长期使用示例值。"
            fi
            if [ -z "${GHCR_TOKEN:-}" ]; then
              echo "缺少 GitHub Secret GHCR_TOKEN（需要 read:packages 的 PAT）。"
              exit 1
            fi

            REPO_LC="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              IMAGE_TAG="$GITHUB_REF_NAME"
            else
              IMAGE_TAG="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            fi
            export BACKEND_IMAGE="ghcr.io/${REPO_LC}/backend:${IMAGE_TAG}"
            export FRONTEND_IMAGE="ghcr.io/${REPO_LC}/frontend:${IMAGE_TAG}"
            export PULL_POLICY=always

            echo "Deploying $BACKEND_IMAGE and $FRONTEND_IMAGE"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans

            wait_healthy() {
              name="$1"
              i=1
              while [ "$i" -le 36 ]; do
                status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$name" 2>/dev/null || echo missing)"
                echo "$name: $status ($i/36)"
                if [ "$status" = "healthy" ]; then
                  return 0
                fi
                sleep 5
                i=$((i + 1))
              done
              return 1
            }

            if ! wait_healthy yostone-backend || ! wait_healthy yostone-frontend; then
              echo "健康检查失败，最近日志："
              docker compose ps -a
              docker compose logs --tail=120
              exit 1
            fi

            docker compose ps
            echo "Deploy finished."

name = "ai"
package = "module_ai"
title = "AI 子系统"
version = "1.0.0"
description = "知识库、文档索引、向量检索和召回验证能力。"
route_prefix = "/ai"
tags = ["ai", "knowledge", "retrieval"]

required_modules = [
  "chromadb",
  "docx",
  "fastembed",
  "jieba",
  "openai",
  "pypdf",
  "whoosh",
]

routers = [
  "chat.controller:ChatRouter",
  "knowledge.controller:KnowledgeRouter",
  "knowledge.app_data.controller:AppDataRouter",
]
websocket_routers = []
model_modules = ["chat.model", "knowledge.model", "knowledge.app_data.model"]
startup_hooks = ["chat.model_config_service:initialize_runtime_chat_model_config"]

permissions = [
  "module_ai:document:create",
  "module_ai:document:delete",
  "module_ai:document:query",
  "module_ai:member:query",
  "module_ai:member:create",
  "module_ai:member:update",
  "module_ai:access:query",
  "module_ai:access:update",
  "module_ai:knowledge:create",
  "module_ai:knowledge:delete",
  "module_ai:knowledge:query",
  "module_ai:knowledge:update",
  "module_ai:model_config:query",
  "module_ai:model_config:update",
  "module_ai:retrieval:test",
]

[seed]
route_names = ["AI"]
route_paths = ["ai"]
component_prefixes = ["module_ai"]
permission_prefixes = ["module_ai:"]

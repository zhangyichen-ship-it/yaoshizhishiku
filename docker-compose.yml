# 在仓库根目录执行：
#   copy .env.example .env
#   docker compose up -d --build
#
# 浏览器默认打开 http://localhost:8080 （FRONTEND_PORT）。
# 后端容器内固定监听 8004；宿主机 BACKEND_PORT 只影响直接访问 API。
# 使用 CD 推送的镜像时，在 .env 里设置 BACKEND_IMAGE / FRONTEND_IMAGE。

name: yostone-knowledge

services:
  mysql:
    image: mysql:8.4
    container_name: yostone-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yostone_knowledge}
      MYSQL_USER: ${MYSQL_USER:-yostone}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - yostone

  redis:
    image: redis:7-alpine
    container_name: yostone-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - yostone

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        VERSION: ${IMAGE_VERSION:-0.0.0}
    image: ${BACKEND_IMAGE:-yostone-knowledge-backend:local}
    container_name: yostone-backend
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      ENVIRONMENT: prod
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8004"
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置至少 32 位的 SECRET_KEY}
      DATABASE_TYPE: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: ${MYSQL_USER:-yostone}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      DATABASE_NAME: ${MYSQL_DATABASE:-yostone_knowledge}
      REDIS_ENABLE: "True"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: ""
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      REDIS_DB_NAME: "1"
      IP_LOCATION_ENABLE: "False"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      KB_CONTROL_PLANE_API_URL: ${KB_CONTROL_PLANE_API_URL:-}
      KB_CONTROL_PLANE_INSTANCE_ID: ${KB_CONTROL_PLANE_INSTANCE_ID:-0}
      KB_CONTROL_PLANE_SERVICE_CREDENTIAL: ${KB_CONTROL_PLANE_SERVICE_CREDENTIAL:-}
    ports:
      - "${BACKEND_PORT:-8004}:8004"
    volumes:
      - chroma_data:/app/data/chroma
      - fastembed_data:/app/data/fastembed
      - bm25_data:/app/data/bm25_index
      - storage_data:/app/storage
      - logs_data:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yostone

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VERSION: ${IMAGE_VERSION:-0.0.0}
    image: ${FRONTEND_IMAGE:-yostone-knowledge-frontend:local}
    container_name: yostone-frontend
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - yostone

volumes:
  mysql_data:
  redis_data:
  chroma_data:
  fastembed_data:
  bm25_data:
  storage_data:
  logs_data:

networks:
  yostone:
    driver: bridge
